name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nestedner
          POSTGRES_PASSWORD: nestedner
          POSTGRES_DB: nestedner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nestedner" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nestedner:nestedner@localhost:5432/nestedner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate (upgrade → downgrade → upgrade)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
